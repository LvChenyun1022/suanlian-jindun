name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run tests
        run: python -X utf8 -m pytest -q tests --basetemp .pytest-ci

  security-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install scanners
        run: python -m pip install bandit pip-audit
      - name: Static security scan
        continue-on-error: true
        run: bandit -q -r src app -ll
      - name: Dependency audit
        continue-on-error: true
        run: pip-audit -r requirements-lock.txt
