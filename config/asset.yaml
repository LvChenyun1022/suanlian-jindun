# GPU 分代残值与压力测试参数（SPEC M5）
# 注：以下数值为公开案例（GPU 算力租赁市场行情报道）校准的假设值，仅用于演示，非真实市场数据。
horizon_months: 48          # 3–4 年加速折旧观察窗
financing_ratio: 0.9        # 融资比例（本金 = 购置成本 × 0.9）
default_lease_term: 36      # 合同未载明租期时的默认租期（月）
default_months_paid: 6      # 极端情景：违约前已收租金月数
ltv_breach: 0.95            # LTV 突破阈值（本金摊还与残值曲线匹配时 base 情景 LTV≈融资比例 0.9）
dscr_breach: 1.0            # DSCR 突破阈值
stress:
  utilization_shock: -0.20  # 压力情景：利用率 -20% → 租金回收率同步 -20%
  default_haircut: 0.30     # 极端情景：违约处置回收折扣 30%
  customer_concentration: 1.0  # 单一客户集中度（单案件演示 = 100%）
# 分代年度残值率锚点（第 1/2/3/4 年末；年内线性插值，体现加速折旧）
generations:
  H100:  [0.62, 0.40, 0.26, 0.18]
  H800:  [0.58, 0.36, 0.23, 0.15]
  A100:  [0.45, 0.28, 0.16, 0.10]
  A800:  [0.42, 0.25, 0.14, 0.08]
  L40S:  [0.50, 0.32, 0.20, 0.12]
  RTX4090: [0.55, 0.38, 0.24, 0.15]
  default: [0.40, 0.24, 0.14, 0.08]
